<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>سناب خاص</title>
<style>
  :root { --bg:#111; --card:#1d1d1d; --text:#f3f3f3; --muted:#999; --accent:#ffd400; --mine:#2b6fff; --theirs:#2a2a2a; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  .screen { display:none; height:100%; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  .screen.active { display:flex; }
  #auth { justify-content:center; align-items:center; padding:24px; gap:12px; }
  #auth h1 { color:var(--accent); margin:0 0 8px; font-size:32px; }
  input[type=email], input[type=password], #msgInput { width:100%; padding:14px; border-radius:12px; border:1px solid #333; background:var(--card); color:var(--text); font-size:16px; }
  button { font-family:inherit; cursor:pointer; border:0; border-radius:12px; padding:14px; font-size:16px; }
  .primary { background:var(--accent); color:#000; font-weight:700; width:100%; }
  .link { background:none; color:var(--muted); width:100%; }
  #err { color:#ff6b6b; min-height:20px; font-size:14px; text-align:center; }
  .box { width:100%; max-width:380px; display:flex; flex-direction:column; gap:12px; align-items:center; }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--card); }
  header b { color:var(--accent); }
  header .btns { display:flex; gap:8px; }
  header button { background:#333; color:var(--text); padding:8px 12px; font-size:14px; }
  #list { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:16px; word-wrap:break-word; line-height:1.4; }
  .msg small { display:block; font-size:11px; color:rgba(255,255,255,.6); margin-top:4px; }
  .mine { align-self:flex-start; background:var(--mine); }
  .theirs { align-self:flex-end; background:var(--theirs); }
  .snap { background:#e8334a; border:0; color:#fff; font-weight:700; }
  .snap.sent { background:#444; color:#ccc; }
  #bar { display:flex; gap:8px; padding:10px; background:var(--card); align-items:center; }
  #bar button { padding:12px 14px; }
  #sendBtn { background:var(--accent); color:#000; font-weight:700; }
  #camBtn { background:#e8334a; color:#fff; }
  #viewer { position:fixed; inset:0; background:#000; z-index:50; display:none; align-items:center; justify-content:center; }
  #viewer.show { display:flex; }
  #viewer img { max-width:100%; max-height:100%; object-fit:contain; }
  #timer { position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); right:16px; background:rgba(0,0,0,.6); color:#fff; padding:6px 12px; border-radius:20px; font-weight:700; }
  #empty { color:var(--muted); text-align:center; margin-top:40px; }
</style>
</head>
<body>

<div id="auth" class="screen active">
  <div class="box">
    <h1>👻 سناب خاص</h1>
    <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
    <input id="pass" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="current-password">
    <div id="err"></div>
    <button class="primary" id="authBtn">دخول</button>
    <button class="link" id="toggleBtn">ما عندك حساب؟ سجّل</button>
  </div>
</div>

<div id="chat" class="screen">
  <header>
    <b id="who">...</b>
    <div class="btns">
      <button id="clearBtn" style="display:none">🗑 مسح الكل</button>
      <button id="outBtn">خروج</button>
    </div>
  </header>
  <div id="list"></div>
  <div id="bar">
    <button id="camBtn" title="صورة">📷</button>
    <input id="msgInput" type="text" placeholder="اكتب رسالة...">
    <button id="sendBtn">إرسال</button>
  </div>
  <input id="file" type="file" accept="image/*" style="display:none">
</div>

<div id="viewer"><div id="timer">8</div><img id="viewImg" alt=""></div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyBiWGDH96wJugWsrNCbS3ft_uyJ3LQizzk",
  authDomain: "snep-7c950.firebaseapp.com",
  projectId: "snep-7c950",
  storageBucket: "snep-7c950.firebasestorage.app",
  messagingSenderId: "788298992373",
  appId: "1:788298992373:web:51cbf329f5a610956e53bc"
};

const ADMIN_EMAIL = "aill1093r@gmail.com";
const VIEW_SECONDS = 8;

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, getDocs, query, orderBy, limit, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const msgsCol = collection(db, "messages");

const $ = (id) => document.getElementById(id);
let signupMode = false;
let unsub = null;
let me = null;
let viewing = false;

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}

function arabicError(code) {
  const map = {
    "auth/invalid-email": "البريد غير صحيح",
    "auth/missing-password": "اكتب كلمة المرور",
    "auth/weak-password": "كلمة المرور ضعيفة (6 أحرف على الأقل)",
    "auth/email-already-in-use": "هذا البريد مسجل مسبقاً، اضغط دخول",
    "auth/invalid-credential": "البريد أو كلمة المرور خطأ",
    "auth/user-not-found": "الحساب غير موجود",
    "auth/wrong-password": "كلمة المرور خطأ",
    "auth/network-request-failed": "مشكلة في الإنترنت",
    "auth/too-many-requests": "محاولات كثيرة، انتظر قليلاً",
    "auth/operation-not-allowed": "التسجيل مغلق",
    "auth/unauthorized-domain": "الدومين غير مضاف في Firebase (Authorized domains)"
  };
  return map[code] || ("خطأ: " + code);
}

$("toggleBtn").onclick = () => {
  signupMode = !signupMode;
  $("authBtn").textContent = signupMode ? "تسجيل حساب" : "دخول";
  $("toggleBtn").textContent = signupMode ? "عندك حساب؟ ادخل" : "ما عندك حساب؟ سجّل";
  $("err").textContent = "";
};

$("authBtn").onclick = async () => {
  const email = $("email").value.trim().toLowerCase();
  const pass = $("pass").value;
  $("err").textContent = "";
  try {
    if (signupMode) await createUserWithEmailAndPassword(auth, email, pass);
    else await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) { $("err").textContent = arabicError(e.code); }
};

$("outBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) { me = null; show("auth"); return; }
  me = { uid: user.uid, email: (user.email || "").toLowerCase() };
  me.name = me.email.split("@")[0];
  $("who").textContent = "👤 " + me.name;
  $("clearBtn").style.display = me.email === ADMIN_EMAIL.toLowerCase() ? "inline-block" : "none";
  show("chat");
  const q = query(msgsCol, orderBy("createdAt", "asc"), limit(200));
  unsub = onSnapshot(q, render, (e) => {
    $("list").textContent = "";
    const d = document.createElement("div");
    d.id = "empty";
    d.textContent = "تعذر تحميل الرسائل: تأكد من قواعد Firestore (" + e.code + ")";
    $("list").appendChild(d);
  });
});

function timeText(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString("ar", { hour: "2-digit", minute: "2-digit" });
}

function render(snap) {
  const list = $("list");
  list.textContent = "";
  if (snap.empty) {
    const d = document.createElement("div");
    d.id = "empty";
    d.textContent = "ما فيه رسائل بعد. ابدأ المحادثة 👋";
    list.appendChild(d);
    return;
  }
  snap.forEach((docSnap) => {
    const m = docSnap.data();
    const isMine = m.uid === me.uid;
    const el = document.createElement("div");
    el.
